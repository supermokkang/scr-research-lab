name: SCR Backtest Report

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Stock symbols (comma-separated)"
        required: true
        default: "VOO"
        type: string
      period:
        description: "Data period"
        required: true
        default: "10y"
        type: choice
        options:
          - 1y
          - 2y
          - 5y
          - 10y
          - max
      timeframe:
        description: "D, W, or M"
        required: true
        default: "W"
        type: choice
        options:
          - D
          - W
          - M

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SCR backtest
        env:
          SYMBOLS: ${{ inputs.symbols }}
          PERIOD: ${{ inputs.period }}
          TIMEFRAME: ${{ inputs.timeframe }}
        run: |
          python -m scripts.scr_runner --symbols "$SYMBOLS" --period "$PERIOD" --timeframe "$TIMEFRAME" --output reports

      - name: Save report (including error details)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scr-backtest-report
          path: reports/
          if-no-files-found: warn
