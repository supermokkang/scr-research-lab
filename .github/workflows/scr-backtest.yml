name: SCR Backtest Report
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Symbols
        required: true
        default: VOO
        type: string
      period:
        description: Period
        required: true
        default: 10y
        type: string
      timeframe:
        description: Timeframe
        required: true
        default: W
        type: string
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.user.login == 'supermokkang') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run backtest on dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SYMBOLS: ${{ inputs.symbols }}
          PERIOD: ${{ inputs.period }}
          TIMEFRAME: ${{ inputs.timeframe }}
        run: python -m scripts.scr_runner --symbols "$SYMBOLS" --period "$PERIOD" --timeframe "$TIMEFRAME" --output reports
      - name: Run backtest from issue
        if: ${{ github.event_name == 'issues' }}
        run: python -m scripts.issue_dispatch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scr-backtest-report
          path: reports/
          if-no-files-found: warn
